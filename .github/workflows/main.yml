name: Deploy to WordPress.org
on:
  push:
    tags:
    - "*"
# The deploy only reads the repository; WordPress.org access comes from the SVN secrets.
permissions:
  contents: read
jobs:
  tag:
    name: New tag
    # Pinned so a new ubuntu-latest image can't change the release environment unannounced.
    # 2.2.6 was deployed on ubuntu-26.04.
    runs-on: ubuntu-26.04
    steps:
      # Actions are pinned to full commit SHAs (the tag can't be moved to different code).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub's current Ubuntu runner images don't include Subversion, which the deploy action needs.
      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: simple-staff-list
          ASSETS_DIR: assets
          BUILD_DIR: trunk
